    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #efe9df; }

      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        background: #efe9df;
      }
      #stage.dragging { cursor: grabbing; }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        will-change: transform;
      }

      .g-cell { position: absolute; }
      .g-item {
        position: absolute;
        overflow: hidden;
        border-radius: 10px;
        background: #e4dccd;
      }
      .g-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
        -webkit-user-drag: none;
        user-select: none;
      }

      /* top scrim so the nav stays legible over bright images */
      .top-scrim { position: fixed; inset: 0 0 auto 0; height: 130px; z-index: 40; pointer-events: none;
        background: linear-gradient(180deg, rgba(20,18,16,0.45), rgba(20,18,16,0)); }

    <!-- Draggable canvas -->
    <div id="stage">
      <div id="canvas"></div>

    <div class="hint"><i class="ri-drag-move-2-line"></i> Drag to explore</div>

    <script>
      // Mobile menu
      const sideMenu = document.getElementById("sideMenu");
      const menuOverlay = document.getElementById("menuOverlay");
      document.getElementById("openMenuBtn").addEventListener("click", () => { sideMenu.classList.remove("-translate-x-full"); menuOverlay.classList.remove("hidden"); });
      const closeMenu = () => { sideMenu.classList.add("-translate-x-full"); menuOverlay.classList.add("hidden"); };
      document.getElementById("closeMenuBtn").addEventListener("click", closeMenu);
      menuOverlay.addEventListener("click", closeMenu);
      document.querySelectorAll(".menu-link").forEach((l) => l.addEventListener("click", closeMenu));
    </script>

    <script>
      // ============================================================
      // Infinite 2D draggable masonry gallery
      // ============================================================
      const IMAGES = [
        "https://framerusercontent.com/images/IaVcYeEdcZnfOMACnHKhRG2eA.jpg?width=1200&height=900",
        "https://framerusercontent.com/images/5cee2EXdbBi2Qd6r09KHa7ZJXw.jpg?width=1000&height=1000",
        "https://framerusercontent.com/images/O64BvWg7qKxhwTsoaMwOogOpIws.png?scale-down-to=1024&width=1200&height=1200",
        "https://framerusercontent.com/images/2fWepbEq4iRUJ6C2yZ31VIckXc4.png?scale-down-to=1024&width=800&height=1200",
        "https://framerusercontent.com/images/C1JRgFChrNMq7qX0hGThqIhtS4.png?scale-down-to=1024&width=904&height=1200",
        "https://framerusercontent.com/images/92QXDUHTXvpknuenDhJMWw8R40.png?scale-down-to=1024&width=1200&height=673",
        "https://framerusercontent.com/images/VC4qwfmfo0MFJmeX4tEZEVbnjn8.png?width=1200&height=800",
        "https://framerusercontent.com/images/T6geNXuDqq1KVexrgVr7YFywx4.png?scale-down-to=1024&width=1200&height=802",
        "https://framerusercontent.com/images/s2qN6O29ysWc0QRn7Kdicvodk.png?scale-down-to=1024&width=800&height=1200",
        "https://framerusercontent.com/images/h87knZPq10A9fQf0b5LZXH7Rvw.png?scale-down-to=1024&width=1200&height=1200",
        "https://framerusercontent.com/images/oairuUrhUpnUEwoYnA5D25TiEeI.png?width=1200&height=800",
        "https://framerusercontent.com/images/pqToNmi7VChoDbXOOdp4whAjGz4.png?scale-down-to=1024&width=1200&height=600",
        "https://framerusercontent.com/images/aDtGubgGAeXhajjsmNZuK79LE.png?scale-down-to=1024&width=1200&height=686",
        "https://framerusercontent.com/images/KISQbq1TEZFjuJMfZ0Gb7hTXoI.png?scale-down-to=1024&width=1200&height=1200",
        "https://framerusercontent.com/images/OxrwN4foa5ceufLjznXGuVD1sk.png?width=1199&height=903",
        "https://framerusercontent.com/images/B4wRK0oEiOLQhDFFqz0BnjXo1E.png?width=906&height=1200",
        "https://framerusercontent.com/images/KnsCNi9u61AcCGrxlpzTM5amLsw.png?width=903&height=665",
        "https://framerusercontent.com/images/Y2Yp18uPF5BVQ1kFtuBU46jol74.png?width=1200&height=1200"
      ];

      const GAP = 10;
      const COL = 300;        // base column width
      const ROW = 150;        // base row height
      // A fully-packed 3-col x 6-row cell (varied spans, no gaps at edges → tiles seamlessly)
      const LAYOUT = [
        { c: 0, r: 0, w: 1, h: 3 },
        { c: 0, r: 3, w: 1, h: 3 },
        { c: 1, r: 0, w: 1, h: 2 },
        { c: 1, r: 2, w: 1, h: 2 },
        { c: 1, r: 4, w: 1, h: 2 },
        { c: 2, r: 0, w: 1, h: 4 },
        { c: 2, r: 4, w: 1, h: 2 },
      ];
      const CELL_W = 3 * COL + 2 * GAP;   // 920
      const CELL_H = 6 * ROW + 5 * GAP;   // 950
      const STRIDE_X = CELL_W + GAP;      // 930
      const STRIDE_Y = CELL_H + GAP;      // 960

      const stage = document.getElementById("stage");
      const canvas = document.getElementById("canvas");

      let cols = 0, rows = 0;

      function px(n) { return n + "px"; }

      let CELLS = []; // { i, j, imgs:[<img>...] }

      function imgFor(worldC, worldR, slot) {
        // deterministic pseudo-random pick per world cell + slot
        let h = (worldC * 73856093) ^ (worldR * 19349663) ^ (slot * 83492791);
        h = (h % IMAGES.length + IMAGES.length) % IMAGES.length;
        return IMAGES[h];
      }

      function buildCanvas() {
        const vw = window.innerWidth || document.documentElement.clientWidth || 1440;
        const vh = window.innerHeight || document.documentElement.clientHeight || 900;
        const needCols = Math.ceil(vw / STRIDE_X) + 3;
        const needRows = Math.ceil(vh / STRIDE_Y) + 3;
        if (needCols === cols && needRows === rows && canvas.childElementCount) return;
        canvas.innerHTML = "";
        CELLS = [];
        cols = needCols;
        rows = needRows;
        const frag = document.createDocumentFragment();
        for (let j = 0; j < rows; j++) {
          for (let i = 0; i < cols; i++) {
            const cell = document.createElement("div");
            cell.className = "g-cell";
            cell.style.left = px(i * STRIDE_X);
            cell.style.top = px(j * STRIDE_Y);
            cell.style.width = px(CELL_W);
            cell.style.height = px(CELL_H);
            const imgs = [];
            for (let s = 0; s < LAYOUT.length; s++) {
              const spec = LAYOUT[s];
              const el = document.createElement("div");
              el.className = "g-item";
              el.style.left = px(spec.c * (COL + GAP));
              el.style.top = px(spec.r * (ROW + GAP));
              el.style.width = px(spec.w * COL + (spec.w - 1) * GAP);
              el.style.height = px(spec.h * ROW + (spec.h - 1) * GAP);
              const img = document.createElement("img");
              img.alt = "Interior";
              el.appendChild(img);
              cell.appendChild(el);
              imgs.push(img);
            }
            CELLS.push({ i, j, imgs });
            frag.appendChild(cell);
          }
        }
        canvas.appendChild(frag);
        baseX = null; baseY = null; // force reassign
        assignImages(true);
      }

      // Map each DOM cell to a world coordinate that shifts as we drag,
      // so wrapping reveals NEW imagery instead of snapping to the same view.
      let baseX = null, baseY = null;
      function assignImages(force) {
        const bx = Math.floor(pos.x / STRIDE_X);
        const by = Math.floor(pos.y / STRIDE_Y);
        if (!force && bx === baseX && by === baseY) return;
        baseX = bx; baseY = by;
        for (const c of CELLS) {
          const worldC = c.i - bx;
          const worldR = c.j - by;
          for (let s = 0; s < c.imgs.length; s++) {
            const src = imgFor(worldC, worldR, s);
            if (c.imgs[s].getAttribute("src") !== src) c.imgs[s].src = src;
          }
        }
      }

      // ---- drag + momentum ----
      let pos = { x: 0, y: 0 };
      let vel = { x: 0, y: 0 };
      let dragging = false;
      let last = { x: 0, y: 0 };
      let moved = 0;

      buildCanvas(); // after pos is declared (assignImages reads pos)

      function wrap(v, s) { return ((v % s) + s) % s; }

      function render() {
        if (!dragging) {
          pos.x += vel.x; pos.y += vel.y;
          vel.x *= 0.94; vel.y *= 0.94;
          if (Math.abs(vel.x) < 0.05) vel.x = 0;
          if (Math.abs(vel.y) < 0.05) vel.y = 0;
        }
        assignImages(false);
        const tx = wrap(pos.x, STRIDE_X) - STRIDE_X;
        const ty = wrap(pos.y, STRIDE_Y) - STRIDE_Y;
        canvas.style.transform = "translate3d(" + tx + "px," + ty + "px,0)";
        requestAnimationFrame(render);
      }
      render(); // set initial transform immediately, then loop

      stage.addEventListener("pointerdown", (e) => {
        dragging = true; moved = 0;
        stage.classList.add("dragging");
        try { stage.setPointerCapture(e.pointerId); } catch (_) {}
        last.x = e.clientX; last.y = e.clientY;
        vel.x = 0; vel.y = 0;
      });

      stage.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - last.x;
        const dy = e.clientY - last.y;
        last.x = e.clientX; last.y = e.clientY;
        pos.x += dx; pos.y += dy;
        // smoothed velocity for inertia
        vel.x = vel.x * 0.6 + dx * 0.4;
        vel.y = vel.y * 0.6 + dy * 0.4;
        moved += Math.abs(dx) + Math.abs(dy);
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        stage.classList.remove("dragging");
        try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
      }
      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", endDrag);

      // wheel / trackpad also pans (nice-to-have)
      stage.addEventListener("wheel", (e) => {
        e.preventDefault();
        pos.x -= e.deltaX; pos.y -= e.deltaY;
        vel.x = 0; vel.y = 0;
      }, { passive: false });

      let rt;
      window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(buildCanvas, 150); });
      window.addEventListener("load", buildCanvas);
      // safety rebuilds in case the viewport reported 0 on first paint
      setTimeout(buildCanvas, 300);
      setTimeout(buildCanvas, 1000);
    </script>
